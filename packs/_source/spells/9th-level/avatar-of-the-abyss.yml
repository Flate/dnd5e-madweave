_id: AvatarAbysspl001
name: Avatar of the Abyss
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You transform into an Eldritch Entity for 1 minute and gain three
      levels of Eldritch Madness.</p>
      <p><strong>Eldritch Entity.</strong> Your size becomes Large, and you
      gain a flying speed of 60 feet. You gain immunity to Vortex, psychic,
      and necrotic damage, and your AC equals 16 + your Dexterity modifier.
      Your hit points double (adjust current HP manually to match).</p>
      <p>You gain the following actions:</p>
      <ul>
        <li><strong>Eldritch Claw.</strong> <em>Melee Attack:</em> +11 to hit,
        reach 10 ft., one target. Hit: 2d10 + 5 slashing damage plus 2d8
        Vortex damage.</li>
        <li><strong>Mind Blast.</strong> <em>Ranged Spell Attack:</em> +13 to
        hit, range 60 ft., one target. Hit: 4d10 Vortex damage, and the target
        must make a Wisdom saving throw or gain two levels of Eldritch
        Madness.</li>
      </ul>
      <p><em>Size change, HP doubling, and special attacks must be managed
      manually. The transformation AE automates speed, immunities, and
      AC.</em></p>
