_id: VoidSparkCant001
name: Void Spark
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You hurl a mote of crackling void energy at a creature within range.
      Make a ranged spell attack against the target. On a hit, the target takes
      1d6 Vortex damage and has disadvantage on the next Wisdom saving throw it
      makes before the end of its next turn.</p>
      <p>This spell's damage increases as you gain levels. At 5th level, the hit
      deals an extra 1d8 Vortex damage. At 11th level, the extra damage increases
      by 1d10. At 17th level, the extra damage increases by 1d12.</p>
