_id: EldApocSpell0001
name: Eldritch Apocalypse
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You unleash a devastating wave of eldritch energy that reaches all
      creatures within 1 mile. Each creature in range takes 10d12 Vortex
      damage and gains one level of Eldritch Madness. Additionally, you
      yourself gain three levels of Eldritch Madness.</p>
      <p>After casting, use <em>Self-inflict EM</em> to apply the three levels
      of Eldritch Madness to yourself.</p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      9th-level spell slot, the damage increases to 12d12 Vortex damage.</p>
