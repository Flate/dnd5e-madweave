_id: EldChainSpell001
name: Eldritch Chains
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You summon chains of eldritch energy that burst from the ground at a
      point you choose within range. These chains have a 15-foot radius and
      rise up to 20 feet into the air. Any creature that starts its turn within
      the area or enters it for the first time on its turn must make a Wisdom
      saving throw. On a failed save, the creature is restrained by the chains,
      takes 4d6 Vortex damage, and gains one level of Eldritch Madness. On a
      successful save, the creature is not restrained and takes half damage.</p>
      <p>While concentrating on this spell, you can use your bonus action to
      cause the chains to constrict, dealing 2d6 Vortex damage to all
      restrained creatures.</p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 7th level or higher, the damage increases by 1d6 for each
      slot level above 6th.</p>
