_id: CorrWaveSpell001
name: Corrupting Wave
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You release a wave of dark, eldritch energy in a 20-foot radius
      centered on you. Each creature in the area must make a Wisdom saving
      throw. On a failed save, the creature takes 4d8 Vortex damage and is
      frightened until the end of their next turn. On a successful save, the
      creature takes half damage and is not frightened.</p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 5th level or higher, the damage increases by 1d8 for each
      slot level above 4th.</p>
