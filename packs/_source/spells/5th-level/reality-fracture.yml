_id: RealFractSpll001
name: Reality Fracture
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You create a rift in reality at a point you choose within range that
      is the size of a 20-foot diameter circle. Any creature that steps into or
      starts its turn in the rift takes 4d12 Vortex damage and must make a
      Wisdom saving throw. On a failed save, the creature takes full damage and
      is teleported to a random, unoccupied location within 60 feet of the
      rift's center (including potentially inside the rift itself). On a
      successful save, the creature takes half damage and is not teleported.</p>
      <p>While concentrating on this spell, you can use your action on each
      subsequent turn to move the rift up to 60 feet in any direction.</p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 6th level or higher, the damage increases by 1d12 for each
      slot level above 5th.</p>
