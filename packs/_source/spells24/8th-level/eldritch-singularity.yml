_id: EldSinglSpell001
name: Eldritch Singularity
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You create a point of eldritch energy, an unstable singularity, at a
      location you choose within range. The singularity has a 10-foot radius
      and pulls everything toward it. Any creature that starts its turn within
      30 feet of the singularity or enters the area for the first time on its
      turn must make a Strength saving throw. On a failed save, the creature is
      pulled 10 feet toward the singularity, takes 5d10 Vortex damage, and
      gains two levels of Eldritch Madness. On a successful save, the creature
      is not pulled and takes half damage.</p>
      <p>Objects within 30 feet of the singularity that are not being worn or
      carried are automatically pulled 10 feet toward it.</p>
      <p>While concentrating on this spell, you can use your action to move the
      singularity up to 60 feet in any direction.</p>
      <p><em>Note: the 10-foot pull on a failed save must be applied
      manually.</em></p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      9th-level spell slot, the damage increases to 6d10 and the radius of the
      singularity expands to 15 feet.</p>
