_id: EldPurgtnSpll001
name: Eldritch Purgation
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You channel a wave of purifying energy into a creature you touch,
      attempting to cleanse it of eldritch taint. The target must make a
      Wisdom saving throw. On a successful save, they lose two levels of
      Eldritch Madness. On a failed save, they lose one level.</p>
      <p>After rolling the save, use <em>Purgation: Success</em> or
      <em>Purgation: Fail</em> to apply the appropriate EM reduction.</p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 8th level or higher, you can target one additional creature
      for each slot level above 7th.</p>
