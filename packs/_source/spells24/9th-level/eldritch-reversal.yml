_id: EldRevrsSpell001
name: Eldritch Reversal
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You attempt to reverse the flow of eldritch energies within a targeted
      area, affecting all creatures within a 30-foot radius sphere. Each
      creature in the area can make a Wisdom saving throw. On a failed save,
      the creature loses all levels of Eldritch Madness but gains one level of
      exhaustion. On a successful save, the creature loses half of their
      Eldritch Madness levels (rounded down) without gaining exhaustion.</p>
      <p>After the save, apply the result using <em>Reversal: Save Failed</em>
      or <em>Reversal: Save Succeeded</em>.</p>
