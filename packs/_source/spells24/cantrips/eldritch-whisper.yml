name: Eldritch Whisper
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You whisper a message infused with eldritch energy to a creature within
      range. The target hears the message and can reply in a whisper that only
      you can hear. If the target does not have at least one level of Eldritch
      Madness, it must make a Wisdom saving throw or gain a level of Eldritch
      Madness.</p>
      <p><em>This spell may only be used by creatures that are affected by at
      least two levels of Eldritch Madness.</em></p>
