_id: RevLightCant0001
name: Revitalizing Light
type: spell
img: icons/magic/light/beam-rays-yellow-white.webp
system:
  description:
    value: >-
      <p>A ray of positive energy is released from a prism you hold aloft,
      striking a target you can see within range. This target may choose to
      spend one of their Hit Dice to regain hit points equal to the roll of
      the Hit Die plus their Constitution modifier.</p>
      <p>This spell has no effect on undead, constructs, or unconscious
      creatures.</p>
      <p><strong>Cantrip Upgrade.</strong> The spell creates two rays at level
      5, three rays at level 11, and four rays at level 17. You can direct the
      rays at the same target or at different ones.</p>
      <p>[[(floor((@details.level+1)/6)+1)]]{Total Rays}</p>
