_id: EldMaelstSpll001
name: Eldritch Maelstrom
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You conjure a swirling vortex of eldritch energy at a point you choose
      within range. The vortex has a 20-foot radius and 40-foot height. Any
      creature that starts its turn within the vortex or enters it for the first
      time on its turn must make a Wisdom saving throw. On a failed save, the
      creature takes 3d8 Vortex damage and gains one level of Eldritch Madness.
      On a successful save, the creature takes half damage and doesn't gain
      Eldritch Madness.</p>
      <p>While concentrating on this spell, you can use your action to move the
      vortex up to 30 feet in any direction.</p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 6th level or higher, the damage increases by 1d8 for each
      slot level above 5th.</p>
