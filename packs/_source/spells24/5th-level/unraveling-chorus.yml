_id: UnrvlChrsSpll001
name: Unraveling Chorus
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You open your mouth and something else speaks through you — a sound that
      is not a sound, a harmony composed of frequencies that were never meant to
      coexist. Choose up to three creatures you can see within range. Each target
      must make a Wisdom saving throw.</p>
      <p>On a failed save, a creature is unraveling for the duration. An
      unraveling creature suffers the following effects:</p>
      <ul>
        <li>At the start of each of its turns, it takes 2d8 Vortex damage.</li>
        <li>It cannot willingly move closer to any other unraveling creature. If
        two or more unraveling creatures start their turn within 10 feet of each
        other, each takes an additional 1d8 Vortex damage as their unraveling
        resonates.</li>
        <li>Its speech becomes unreliable. When an unraveling creature attempts
        to cast a spell with a verbal component, it must succeed on a DC 15
        Intelligence check or the spell fails (the slot is expended).</li>
      </ul>
      <p>On a successful save, a creature takes 2d8 Vortex damage and is not
      unraveling.</p>
      <p>An unraveling creature can repeat the saving throw at the end of each
      of its turns, ending the effect on itself on a success. Each time it fails
      the repeated save, the DM may optionally require an Eldritch Resonance
      table roll as though the creature had cast an Eldritch Arcanum spell of
      this spell's level.</p>
      <p><em>Note: start-of-turn damage (2d8, +1d8 proximity), movement
      restriction, verbal component check (DC 15 INT), and end-of-turn repeat
      saves must all be handled manually. Apply the Unraveling AE on a failed
      save.</em></p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 6th level or higher, you can target one additional creature
      for each slot level above 5th.</p>
