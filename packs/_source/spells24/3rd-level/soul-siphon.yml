  description:
    value: >-
      <p>Touch a creature within range. Make a melee spell attack against that
      creature. On a hit, the creature takes 3d10 Vortex damage, and you regain
      hit points equal to half the amount of Vortex damage dealt.</p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 4th level or higher, the damage increases by 1d10 for each
      slot level above 3rd.</p>
