_id: TearInVeilSpl001
name: Tear in the Veil
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You claw at the membrane between planes and something pushes through
      from the other side. A Veil-Born manifests in an unoccupied space you can
      see within range. It acts on your initiative count, immediately after your
      turn.</p>
      <p>The Veil-Born obeys your spoken commands (no action required). If you
      issue no command, it attacks the nearest creature that is not you. You do
      not choose what comes through — the DM determines the Veil-Born's exact
      appearance, which is always unsettling.</p>
      <p>When the Veil-Born is first summoned, each creature within 10 feet of
      the summoning point (other than you) must make a Wisdom saving throw or
      become frightened of the Veil-Born until the end of its next turn. Use the
      <strong>Summoning Fear</strong> activity.</p>
      <p>When the spell ends — whether by your choice, by losing concentration,
      or because the Veil-Born is reduced to 0 hit points — the tear seals shut
      violently. Each creature within 5 feet of the Veil-Born when it disappears
      takes 2d6 Vortex damage (no save). You must then make a Wisdom saving
      throw against your own spell save DC. On a failure, you gain one level of
      Eldritch Madness. Use the <strong>Tear Seals Shut</strong> and
      <strong>Seal Backlash</strong> activities when the spell ends.</p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 4th level or higher, the Veil-Born's hit points increase by
      10 and its Rend deals 1 additional die of Vortex damage for each slot level
      above 3rd. The Unstable Form trigger also expands: 4th–5th level triggers
      on a 1, 6th–7th on a 1–2, and 8th–9th on a 1–3.</p>
