_id: CreepTaintSpl001
name: Creeping Taint
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You fix your attention on a creature you can see within range and mark
      it with an invisible stain that sinks beneath the skin. For the duration,
      whenever the target takes Vortex damage from any source, it takes an
      additional 1d4 Vortex damage. Additionally, the target has disadvantage on
      saving throws against gaining levels of Eldritch Madness.</p>
      <p>If the target drops to 0 hit points before the spell ends, you can use
      a bonus action on a subsequent turn to move the taint to a new creature you
      can see within 30 feet of the original target. The taint crawls visibly
      across the ground or through the air to reach the new host — all creatures
      who can see this must succeed on a DC 10 Wisdom saving throw or become
      frightened of the new host until the end of their next turn.</p>
      <p><em>Note: the additional Vortex damage and EM save disadvantage must be
      tracked manually. Use <strong>Move Taint</strong> against each observer
      when moving the taint.</em></p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 3rd level or higher, the additional Vortex damage increases
      to 1d6. At 5th level or higher, it increases to 1d8.</p>
