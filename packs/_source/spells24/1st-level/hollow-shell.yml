_id: HollwShellSpl001
name: Hollow Shell
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You momentarily hollow yourself out — your body becomes a vessel for the
      void rather than a target. You gain resistance to the triggering damage.
      Until the start of your next turn, you also gain resistance to Vortex
      damage.</p>
      <p>However, while the shell persists, you appear wrong to anyone looking at
      you. Your shadow moves independently. Your reflection doesn't match. Until
      the start of your next turn, any creature that can see you and attempts to
      target you with a spell that restores hit points must succeed on a Wisdom
      saving throw against your spell save DC or the spell fails (the slot is not
      expended).</p>
      <p>If you are currently affected by at least one level of Eldritch Madness
      when you cast this spell, you also gain temporary hit points equal to your
      spellcasting ability modifier.</p>
      <p><em>Note: resistance to the triggering damage type and the healing-spell
      interference must be applied manually. Vortex resistance and temporary hit
      points (if EM 1+) are automated via the AE.</em></p>
