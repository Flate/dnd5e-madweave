_id: VoidSplntSpell01
name: Void Splinter
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You reach into the space between moments and pull. Reality cracks — a
      hairline fracture, barely visible, lances toward a creature you can see
      within range. The fracture passes through matter, ignoring cover.</p>
      <p>Make a ranged spell attack against the target. This attack ignores half
      cover and three-quarters cover. On a hit, the target takes 2d6 Vortex
      damage. If the target is concentrating on a spell, it has disadvantage on
      the Constitution saving throw to maintain concentration against this
      damage.</p>
      <p><em>Note: cover is ignored automatically; concentration save
      disadvantage must be applied manually.</em></p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 2nd level or higher, the damage increases by 1d6 for each
      slot level above 1st.</p>
