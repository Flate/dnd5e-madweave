_id: CmmnOfScrsSpll01
name: Communion of Scars
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You press your consciousness against the membrane of reality and listen.
      The membrane pushes back. You may ask up to three questions about a
      creature, object, location, or event. The answers arrive not as words but
      as knowledge — sudden, intrusive, and accompanied by a visceral
      understanding you didn't ask for.</p>
      <p>For each question, the DM provides a truthful answer in the form of a
      brief vision, sensation, or flash of knowing. The answer is always accurate
      but may be incomplete, symbolic, or contextualized by perspectives that are
      not mortal. The knowledge comes from beyond — it is not filtered through
      any divine intermediary or patron. No god can intercept or falsify the
      answer, and no god is aware that the question was asked.</p>
      <p><strong>The Cost.</strong> After receiving the answers, you must make a
      Wisdom saving throw (DC 10 + the number of questions asked × 3). On a
      failure, you gain one level of Eldritch Madness. Regardless of the save
      result, you suffer a scar of knowing: for the next 24 hours, you have
      vulnerability to psychic damage as the knowledge settles imperfectly into
      your mind.</p>
      <p>If you are already affected by three or more levels of Eldritch Madness
      when you cast this spell, the DC is reduced by 5. You also receive a fourth
      answer to a question you did not ask. The DM chooses what you learn. It is
      always true. It is rarely kind.</p>
      <p><em>Use <strong>Ask Questions</strong> for the casting. Then use
      <strong>The Cost</strong> after receiving answers. DC: 1 question = 13, 2
      = 16, 3 = 19. Reduce by 5 if EM 3+. Psychic vulnerability AE applies
      regardless of the save result.</em></p>
