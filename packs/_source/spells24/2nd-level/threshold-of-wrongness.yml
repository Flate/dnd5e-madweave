_id: ThrshWrngSpll001
name: Threshold of Wrongness
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You designate a line up to 20 feet long and 10 feet high at a point you
      can see within range. The line shimmers — not with light, but with the
      absence of something fundamental. Space on either side of the line no
      longer agrees with itself.</p>
      <p>Any creature that crosses the line or starts its turn within 5 feet of
      either side must make a Wisdom saving throw. On a failure, the creature is
      displaced: it arrives 10 feet away from where it intended in a random
      direction (roll a d8 for direction). It also takes 1d6 Vortex damage as
      its body briefly occupies two locations. On a success, the creature crosses
      normally but takes half damage.</p>
      <p>A creature that has been displaced by this spell has its speed halved
      until the end of its next turn as its sense of space recalibrates.</p>
      <p>The line is invisible to creatures without Eldritch Sight or truesight.
      Other creatures can perceive it only by noticing that something is subtly
      wrong — parallel lines don't quite meet, sounds arrive from the wrong
      direction — with a successful DC 15 Intelligence (Investigation)
      check.</p>
      <p><em>Note: the displacement (d8 direction, 10 ft move) and line
      invisibility must be handled manually. Walk speed halving is automated via
      the AE; other movement types must be halved manually.</em></p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 3rd level or higher, the line's length increases by 10 feet
      for each slot level above 2nd.</p>
