_id: EldGraspSpell001
name: Eldritch Grasp
type: spell
img: systems/dnd5e/icons/svg/schools/eldritch-arcanum.svg
system:
  description:
    value: >-
      <p>You unleash a shadowy tendril from your hand that reaches for a
      creature you can see within range. Make a ranged spell attack against the
      target. On a hit, the target takes 2d8 Vortex damage and is restrained by
      the tendrils until the end of your next turn.</p>
      <p><strong>At Higher Levels.</strong> When you cast this spell using a
      spell slot of 3rd level or higher, the damage increases by 1d8 for each
      slot level above 2nd.</p>
