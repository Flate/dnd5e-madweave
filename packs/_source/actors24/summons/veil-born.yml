items:
  - name: Unstable Form
    system:
      description:
        value: >-
          <p>The Veil-Born's shape is never fixed. At the start of each of its
          turns, roll a d6 using the button below. If the result is at or below
          the threshold, the Veil-Born does not obey any commands this turn and
          instead moves toward and attacks the nearest creature (including the
          caster).</p>
          <p><strong>Threshold by spell slot:</strong> 3rd–5th level: 1 | 6th–7th
          level: 1–2 | 8th–9th level: 1–3</p>
