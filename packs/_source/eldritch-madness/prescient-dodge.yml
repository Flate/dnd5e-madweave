_id: EldPrescientDodge
name: Prescient Dodge
type: feat
img: systems/dnd5e/icons/svg/statuses/eldritch-madness-3.svg
system:
  description:
    value: >-
      <p><strong>Requirement:</strong> Eldritch Madness level 3 or higher.</p>
      <p>Once per long rest, you may evade an incoming attack (forcing the
      attacker to reroll) or automatically succeed on a saving throw.</p>
      <p><strong>Consequence:</strong> Immediately after invoking this ability,
      you must make a DC 15 Wisdom saving throw (rolled automatically). On a
      failure, you are <strong>stunned</strong> until the end of your next
      turn.</p>
      <p><em>No Eldritch Madness is gained from this ability.</em></p>
